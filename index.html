/* Layout: a sticky team bar, a "right now" strip, then one calendar (7-col grid on desktop, day list on phone). Tapping a day opens a bottom sheet editor. Writes are gated by a claimed account + shared password. */

  --long:#330072; --long-bg:#e9e2f3;
  --short:#b35c00; --short-bg:#fff0d1;
  --clinic:#007f3b; --clinic-bg:#dcefe4;
  --leave:#4c6272; --leave-bg:#e8edef;
  --warn:#da291c; --warn-bg:#fbe4e2; --duty-bg:#fdf3f2;
  --pend:#8a6000; --pend-bg:#fff1c9;
  --swap:#ed8b00;
  --today:#005eb8;
  --display:"Source Sans 3",Frutiger,Arial,sans-serif; --body:"Source Sans 3",Frutiger,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;

<script>
(() => {
'use strict';
const DAY = 86400000;
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (k==='class') e.className=v; else if (k==='html') e.innerHTML=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v!==false && v!=null) e.setAttribute(k, v===true?'':v); } for (const k of kids.flat()) if (k!=null) e.append(k.nodeType?k:document.createTextNode(String(k))); return e; };

/* ---------- defaults ---------- */
const DEFAULT_G = { appName:'UHCW T&O On-Call Rota', subtitle:'Trauma & Orthopaedics · all teams', pin:'ROTA', adminPin:'ROTAUHCW', emailDomain:'uhcw.nhs.uk' };
const DEFAULT_TEAM = {
  id:'team3', name:'Team 3', short:'T3', active:true, order:3,
  anchorDate:'2026-11-04', anchorWeek:4, oncallWeekday:2, clinicWeekdays:[2], weekendWeek:3,
  consultants:[
    { id:'isaac',    name:'Mr Isaac',    short:'RI', slot:1, clinic:true },
    { id:'rupani',   name:'Mr Rupani',   short:'NR', slot:2, clinic:true },
    { id:'elsayed',  name:'Mr Elsayed',  short:'HE', slot:3, clinic:true },
    { id:'kozdryk',  name:'Mr Kozdryk',  short:'JK', slot:4, clinic:true },
    { id:'dhukaram', name:'Mr Dhukaram', short:'VD', slot:0, clinic:true },
    { id:'young',    name:'Mr Young',    short:'JY', slot:0, clinic:true },
  ],
  weekendPattern:[[1,3],[4,2],[3,1],[2,4]],
};
const fixedTeam = n => ({ id:'team'+n, name:'Team '+n, short:'T'+n, active:n===3, order:n, anchorDate:'2026-11-04', anchorWeek:4, oncallWeekday:n-1, clinicWeekdays:[n-1], weekendWeek:n, consultants:[], weekendPattern:[[1,3],[4,2],[3,1],[2,4]] });
const FIXED_TEAMS=[1,2,3,4];

/* ---------- state ---------- */
const state = { G: {...DEFAULT_G}, teams:{}, overrides:{}, weekends:{}, clinic:{}, leave:{}, requests:{}, accounts:{}, log:[], db:null, acct:null, login:'', canWrite:true, open:null, seenLocal:'', viewTeam:'', sheetTeam:'' };
try { state.login = localStorage.getItem('rota.login') || ''; state.seenLocal = localStorage.getItem('rota.seen') || ''; state.viewTeam = localStorage.getItem('rota.viewTeam') || ''; } catch(e) {}
const unlocked = () => { try { return sessionStorage.getItem('rota.unlocked')==='1'; } catch(e){ return false; } };
const emailKey = em => (em||'').trim().toLowerCase();

/* ---------- date helpers ---------- */
const ymd = d => d.toISOString().slice(0,10);
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); };
const addDays = (d,n) => new Date(d.getTime()+n*DAY);
const dow = d => (d.getUTCDay()+6)%7;
const mondayOf = d => addDays(d,-dow(d));
const todayKey = () => { const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; };
const DN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DNL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtLong = d => `${DNL[dow(d)]} ${d.getUTCDate()} ${MN[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
const fmtShort = d => `${DN[dow(d)]} ${d.getUTCDate()} ${MN[d.getUTCMonth()].slice(0,3)}`;
const fmtKey = k => fmtShort(parse(k));
const nowIso = () => new Date().toISOString();

/* ---------- teams & engine (S() = the team currently being worked on) ---------- */
const G = () => state.G;
const normPat = pat => (pat||[]).map(p=>Array.isArray(p)?p.slice(0,2):[Number(p.long)||0,Number(p.short)||0]);
const normTeam = t => ({...t, weekendPattern: normPat(t.weekendPattern)});
const encTeam = t => ({...t, weekendPattern: normPat(t.weekendPattern).map(p=>({long:p[0],short:p[1]}))});
const allTeams = () => FIXED_TEAMS.map(n=>state.teams['team'+n] || (n===3?DEFAULT_TEAM:fixedTeam(n)));
const teams = () => { const list=allTeams().filter(t=>t.active!==false); return list.length?list:[allTeams()[2]]; };
const teamById = id => teams().find(t=>t.id===id) || null;
let CT = null;
const S = () => CT || teams()[0];
const setTeam = id => { CT = teamById(id) || teams()[0]; };
const allCons = () => teams().flatMap(t=>t.consultants.map(c=>({...c,team:t.id})));
const cons = () => S().consultants;
const byId = id => allCons().find(c=>c.id===id) || null;
const teamOf = id => (byId(id)||{}).team || '';
const bySlot = n => cons().find(c=>c.slot===n) || null;
const nameOf = id => (byId(id)||{}).name || (id==='admin'?'Administrator':(id ? '(removed)' : '—'));
const shortOf = id => (byId(id)||{}).short || (byId(id)||{}).name || '?';
const dk = key => S().id+'~'+key;
function cycleStart(){ const mon=mondayOf(parse(S().anchorDate)); return addDays(mon,-(S().anchorWeek-1)*7); }
function weekInfo(d){ const mon=mondayOf(d); const w=Math.round((mon-cycleStart())/(7*DAY)); return { wk:((w%4)+4)%4+1, cycle:Math.floor(w/4), mon }; }
function onLeave(id, key){ return Object.values(state.leave).some(l=>l.who===id && l.from<=key && l.to>=key); }
function leaveOn(key){ const ids=new Set(cons().map(c=>c.id)); return Object.values(state.leave).filter(l=>ids.has(l.who) && l.from<=key && l.to>=key); }
function weekendFor(d){
  const wi=weekInfo(d); const dd=dow(d);
  if (dd<4 || wi.wk!==S().weekendWeek) return null;
  const fri=addDays(wi.mon,4); const friKey=ymd(fri);

$('#btnExport').onclick=()=>modal('Calendar file', bd=>{
  setTeam(primaryTeamId());
  const who=consSel(teamOf(myId())===S().id?myId():'',true); who.id='ex-who'; who.firstChild.textContent='Whole '+S().name;
  const months=el('select',{class:'inp',id:'ex-months'}, el('option',{value:'6'},'next 6 months'), el('option',{value:'12',selected:true},'next 12 months'), el('option',{value:'24'},'next 24 months'));
  const copyBox=el('textarea',{class:'inp',rows:'8',style:'width:100%;font-family:var(--mono);font-size:11px',hidden:true,id:'ex-copy'});
  const go=el('button',{class:'btn primary',onclick:()=>{ setTeam(primaryTeamId()); const ics=buildIcs(who.value,Number(months.value)); try { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download=(who.value?nameOf(who.value).replace(/\s+/g,'_'):S().short)+'_oncall.ics'; document.body.append(a); a.click(); a.remove(); toast('Calendar file downloaded. Import it into Google Calendar or Outlook.'); } catch(e){ copyBox.hidden=false; copyBox.value=ics; } }},'Download .ics file');
  bd.append(el('div',{class:'sec'}, el('h3',{},'Export '+S().name+' on-call duties'), el('div',{class:'fr'}, el('label',{for:'ex-who'},'For'), who, months, go), el('div',{class:'note'},'Weekday on call, weekend duties and post-take Mondays as all-day events, with approved swaps applied. Re-export after swaps; calendar apps do not sync back.'), copyBox));

function buildIcs(who, months){
  const t=parse(todayKey()); const end=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+months,t.getUTCDate()));
  const esc=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m); const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=[]; const add=(d,summary,desc)=>{ const k=ymd(d).replace(/-/g,''); const k2=ymd(addDays(d,1)).replace(/-/g,''); ev.push(['BEGIN:VEVENT','UID:'+S().id+'-'+k+'-'+summary.replace(/\W+/g,'')+'@rota','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+k,'DTEND;VALUE=DATE:'+k2,'SUMMARY:'+esc(summary),'DESCRIPTION:'+esc(desc),'END:VEVENT'].join('\r\n')); };
  for (let d=t; d<end; d=addDays(d,1)){ const i=dayInfo(d);
    if (i.oncall && (!who||i.oncall.id===who)) add(d,'On call: '+nameOf(i.oncall.id)+(i.oncall.override?' (swap)':''),'Weekday on call, '+S().name);
    if (i.weekend){ const w=i.weekend; if (i.dow===4&&(!who||w.long===who)) add(d,'On call (long weekend, Fri): '+nameOf(w.long),'On call + trauma list'); if (i.dow===5){ if(!who||w.short===who) add(d,'On call (short weekend): '+nameOf(w.short),'On call + trauma list'); if(!who||w.long===who) add(d,'Ward round (long weekend): '+nameOf(w.long),'Morning ward round, then home'); } if (i.dow===6){ if(!who||w.long===who) add(d,'On call (long weekend, Sun): '+nameOf(w.long),'On call + trauma list'); if(!who||w.short===who) add(d,'Ward round (short weekend): '+nameOf(w.short),'Ward round'); } }
    if (i.post && (!who||i.post.long===who)) add(d,'Post-take + VFC: '+nameOf(i.post.long),'Post-take ward round and virtual fracture clinic');
    if (i.clinic && who && i.clinic.present.includes(who)) add(d,'Fracture clinic','Consultant present in fracture clinic'+(i.clinic.registrar?' · Reg: '+i.clinic.registrar:''));
  }
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Team rota//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:'+esc(S().name)+(who?' · '+esc(nameOf(who)):''),...ev,'END:VCALENDAR'].join('\r\n')+'\r\n';
}

/* ---------- boot ---------- */
render();
(async()=>{
  let db=null;
  try { firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); } catch(e){ console.error(e); }
  if (!db){ state.canWrite=false; render(); return; }
  state.db=db; render();
  const err=e=>{ console.error(e); if (e&&(e.code==='permission-denied')){ state.canWrite=false; render(); } };
  db.doc('settings/main').onSnapshot(snap=>{ if (snap.exists) state.G={...DEFAULT_G,...snap.data()}; else db.doc('settings/main').set(DEFAULT_G).catch(()=>{}); render(); }, err);
  let seeded=false;
  db.collection('teams').onSnapshot(snap=>{ const o={}; for (const d of snap.docs) o[d.id]=normTeam({...d.data(),id:d.id}); state.teams=o; if (!seeded){ seeded=true; for (const n of FIXED_TEAMS){ if (!o['team'+n]) db.doc('teams/team'+n).set(encTeam(n===3?DEFAULT_TEAM:fixedTeam(n))).catch(()=>{}); } } render(); }, err);
  const coll=(name,target)=>db.collection(name).onSnapshot(snap=>{ const o={}; for (const d of snap.docs) o[d.id]={id:d.id,...d.data()}; state[target]=o; render(); }, err);
  coll('overrides','overrides'); coll('weekends','weekends'); coll('clinic','clinic'); coll('leave','leave');
  let firstReq=true;
  db.collection('requests').onSnapshot(snap=>{ const o={}; for (const d of snap.docs) o[d.id]={id:d.id,...d.data()}; state.requests=o;
    if (!firstReq && acct()) for (const ch of snap.docChanges()) { const r={id:ch.doc.id,...ch.doc.data()}; if (ch.type==='added' && r.status==='pending' && (r.to===myId()||(isAdmin()&&r.to==='admin')) && r.createdBy!==actor()) toast('New request from '+nameOf(r.from)+' waiting for you.'); }
    firstReq=false; render(); }, err);
  let firstAcct=true;
  db.collection('accounts').onSnapshot(snap=>{ const o={}; for (const d of snap.docs) o[d.id]={id:d.id,...d.data()}; state.accounts=o; syncAcct(); render(); if (firstAcct){ firstAcct=false; if (!state.acct) setTimeout(openAccount,500); } }, err);
  db.doc('log/recent').onSnapshot(snap=>{ state.log=(snap.exists&&snap.data().entries)||[]; if (state.open) state.open(); }, ()=>{});
})();
})();

/* ---------- pull to refresh (home-screen mode has no browser refresh) ---------- */
(()=>{ const bar=document.getElementById('ptr'); let y0=null, pulled=0; const MAX=70;
  document.addEventListener('touchstart',e=>{ if (window.scrollY<=0 && !document.querySelector('.sheet')) y0=e.touches[0].clientY; else y0=null; },{passive:true});
  document.addEventListener('touchmove',e=>{ if (y0===null) return; pulled=Math.max(0,Math.min(MAX,(e.touches[0].clientY-y0)*0.5)); bar.style.height=pulled+'px'; bar.firstChild.textContent=pulled>=MAX?'Release to refresh':'Pull to refresh'; },{passive:true});
  document.addEventListener('touchend',()=>{ if (y0!==null && pulled>=MAX){ bar.firstChild.textContent='Refreshing…'; setTimeout(()=>location.reload(),150); } else bar.style.height='0'; y0=null; pulled=0; });
})();
